<script>
// Deklarasi variabel global
let dataNama = [];
let dataKampus = [];
let namaTerpilih = "";
let kampusTerpilih = "";
let lat = "";
let lng = "";
let fotoBase64 = "";
let sedangKirim = false;
let kampusDipilihDulu = false; 
let jenisPresensi = "BIASA";
let butuhAlasan = false;

google.script.run.withSuccessHandler(function(list){
  const sel = document.getElementById("alasanSelect");
  (list || []).forEach(a=>{
    const opt = document.createElement("option");
    opt.value = a;
    opt.innerText = a;
    sel.appendChild(opt);
  });
}).getAlasanPulangTanpaMasuk();

document.getElementById("alasanSelect").addEventListener("change", function(){
  document.getElementById("alasanLainnyaInput").style.display =
    (this.value === "Lainnya") ? "block" : "none";
});

// ================= PILIH JENIS PRESENSI (WFH / BIASA) =================
function pilihJenis(jenis){
  jenisPresensi = jenis;

  document.getElementById("btnBiasa").classList.toggle("active", jenis === "BIASA");
  document.getElementById("btnWFH").classList.toggle("active", jenis === "WFH");

  const ket = document.getElementById("jenisKeterangan");
  if (jenis === "WFH") {
    ket.innerText = "Presensi WFH tidak memerlukan radius jarak ke kantor.";
  } else {
    ket.innerText = "Wajib berada dalam radius kantor BAZNAS.";
  }
}

// Ambil data kampus dan nama dari GAS
google.script.run.withSuccessHandler(function(listKampus) {
  dataKampus = listKampus;
}).getListKampusDropdown();

google.script.run.withSuccessHandler(function(listNama) {
  dataNama = listNama;
}).getListNamaDropdown();

function compressImage(dataUrl, maxWidth = 480, quality = 0.6){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = function(){
      let width = img.width;
      let height = img.height;

      if (width > maxWidth) {
        height = Math.round(height * (maxWidth / width));
        width = maxWidth;
      }

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);

      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}

function handleFoto(event){
  const file = event.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = async function(e){
    fotoBase64 = await compressImage(e.target.result, 480, 0.6);

    document.getElementById("previewFoto").src = fotoBase64;
    document.getElementById("previewFoto").style.display = "block";

    document.getElementById("btnSelfie").style.display = "none";
    document.getElementById("afterCapture").style.display = "block";
  };

  reader.readAsDataURL(file);
}

const namaInput = document.getElementById("namaInput");
const listNamaBox = document.getElementById("listNama");

namaInput.addEventListener("input", function(){
  let keyword = this.value.toLowerCase();
  listNamaBox.innerHTML = "";

  if (!keyword) return;

  let hasil = dataNama.filter(obj =>
    obj.nama.toLowerCase().includes(keyword)
  );

  hasil.forEach(obj => {
    let div = document.createElement("div");
    div.className = "itemNama";
    div.innerText = obj.nama;

    div.onclick = function(){
      const konfirmasi = confirm(
        'Kunci perangkat ini untuk absen atas nama "' + obj.nama + '"?\n\n' +
        'Setelah dikunci, perangkat ini hanya bisa dipakai untuk nama ini.'
      );
      if(!konfirmasi) return;

      setDeviceLock(obj);
      tampilkanInfoDeviceLock(obj.nama);
      terapkanNamaTerpilih(obj);

      listNamaBox.innerHTML = "";
    };

    listNamaBox.appendChild(div);
  });
});

// Lokasi otomatis dengan error handling
navigator.geolocation.getCurrentPosition(
  pos => {
    lat = pos.coords.latitude;
    lng = pos.coords.longitude;
  },
  err => {
    showPopup("Lokasi tidak dapat diakses: " + err.message);
    lat = "";
    lng = "";
  }
);

// POPUP FUNCTION
function showPopup(text){
  document.getElementById("popupText").innerText = text;
  document.getElementById("popup").style.display = "flex";
}

function tutupPopup(){
  document.getElementById("popup").style.display = "none";
}


function ulangFoto(){
  fotoBase64 = "";
  document.getElementById("fotoInput").value = "";

  document.getElementById("previewFoto").style.display = "none";
  document.getElementById("previewFoto").src = "";

  document.getElementById("btnSelfie").style.display = "inline-block";
  document.getElementById("afterCapture").style.display = "none";
}

function playVoice(text) {
  try {
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = "id-ID";
    msg.rate = 1;
    msg.pitch = 1;
    speechSynthesis.cancel();
    speechSynthesis.speak(msg);
  } catch(e) {
    console.log("Voice error:", e);
  }
}

// SUBMIT PRESENSI
function submit(){
  if (sedangKirim) return;

  const nama = namaTerpilih || namaInput.value;

  if (!nama) {
    showPopup("Pilih atau ketik nama dulu!");
    return;
  }

  const selectedData = dataNama.find(obj => obj.nama === nama);

  if (!selectedData) {
    showPopup("Nama tidak ditemukan!");
    return;
  }

  const nim = selectedData.nim ? String(selectedData.nim) : "";
  const gender = selectedData.gender ? String(selectedData.gender) : "";
  const kampus = selectedData.kampus ? String(selectedData.kampus) : "";

  if (nim.trim() === "") {
    showPopup("NIM belum diisi. Hubungi admin terlebih dahulu!");
    return;
  }

  if (gender.trim() === "") {
    showPopup("Gender belum diisi. Hubungi admin terlebih dahulu!");
    return;
  }

  if (kampus.trim() === "") {
    showPopup("Kampus belum diisi!");
    return;
  }

  if (!fotoBase64) {
    showPopup("Ambil foto dulu!");
    return;
  }

  let alasanFinal = "";
  if (butuhAlasan) {
    const alasanPilih = document.getElementById("alasanSelect").value;
    if (!alasanPilih) {
      showPopup("Pilih alasan terlebih dahulu!");
      return;
    }
    if (alasanPilih === "Lainnya") {
      const teks = document.getElementById("alasanLainnyaInput").value.trim();
      if (!teks) {
        showPopup("Tuliskan alasan pada kolom Lainnya!");
        return;
      }
      alasanFinal = teks;
    } else {
      alasanFinal = alasanPilih;
    }
  }

  if (lat === "" || lng === "") {
    showPopup("Lokasi tidak tersedia. Pastikan GPS aktif!");
    return;
  }

  sedangKirim = true;
  document.getElementById("loading").style.display = "flex";
  document.getElementById("btnSubmit").disabled = true;

  google.script.run
    .withSuccessHandler(result => {
      document.getElementById("loading").style.display = "none";
      showPopup(result);
      tampilkanStatus(result);
      kunciForm();
      playVoice(result);
    })
    .withFailureHandler(error => {
      document.getElementById("loading").style.display = "none";
      showPopup("Gagal kirim presensi: " + error.message);
      sedangKirim = false;
      document.getElementById("btnSubmit").disabled = false;
      document.getElementById("btnSelfie").disabled = false;
    })
    .submitPresensi({
      nama: nama,
      nim: nim,
      kampus: kampus,
      gender: gender,
      lokasi: lat + "," + lng,
      foto: fotoBase64,
      jenisPresensi: jenisPresensi,
      alasan: alasanFinal
    });
}


function kontrolModeFrontend(mode, status){

  const btnSelfie = document.getElementById("btnSelfie");
  const btnSubmit = document.getElementById("btnSubmit");

  if(mode === "LOCK"){
    btnSelfie.disabled = true;
    showPopup("Presensi terkunci di jam ini");
  }

  if(status === "SELESAI"){
    btnSelfie.disabled = true;
    if(btnSubmit) btnSubmit.disabled = true;
    showPopup("Anda sudah menyelesaikan presensi hari ini");
  }

}

// ================= CEK STATUS SAAT HALAMAN DIBUKA =================
function cekStatusAwal() {
  const nama = namaTerpilih || namaInput.value;
  if (!nama) return;

  google.script.run
    .withSuccessHandler(function(res) {

      // Default: sembunyikan box alasan
      butuhAlasan = false;
      document.getElementById("alasanPulangBox").style.display = "none";

      if (res.mode === "LOCK") {
        tampilkanStatus("Presensi sedang terkunci");
        kunciForm();
        return;
      }

      if (res.status === "SELESAI") {
        tampilkanStatus("Anda sudah menyelesaikan presensi hari ini");
        kunciForm();
        return;
      }

      if (res.status === "BELUM" && res.mode === "PULANG") {
        tampilkanStatus("Anda belum absen masuk. Silakan pilih alasan keterlambatan untuk absen masuk sekarang.");
        butuhAlasan = true;
        document.getElementById("alasanPulangBox").style.display = "block";
        return;
      }

      if (res.status === "SUDAH_MASUK" && res.manual) {
        tampilkanStatus("Anda sudah absen masuk (terlambat: " + res.alasan + "). Silakan absen pulang.");
        return;
      }
      
      if (res.status === "SUDAH_MASUK" && res.mode === "PULANG") {
        tampilkanStatus("Silakan melakukan absen pulang");
        return;
      }

      if (res.status === "SUDAH_MASUK" && res.mode === "MASUK") {
        tampilkanStatus("Anda sudah absen masuk");
        kunciForm();
        return;
      }

    })
    .getStatusPresensi(nama);
}

function tampilkanStatus(text){
  const box = document.getElementById("statusBox");
  box.innerText = text;
  box.style.display = "block";

function kunciForm(){
  document.getElementById("btnSelfie").disabled = true;

  namaInput.disabled = true;

  document.getElementById("btnWFH").disabled = true;

  document.getElementById("previewFoto").style.filter = "grayscale(100%)";

}

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    document.getElementById("video").srcObject = stream;
  } catch (err) {
    alert("Izin kamera ditolak. Silakan cek pengaturan browser.");
    console.error(err);
  }
}

const DEVICE_LOCK_KEY = "presensi_device_lock_v1";

function getDeviceLock(){
  try {
    const raw = localStorage.getItem(DEVICE_LOCK_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}
function setDeviceLock(data){ localStorage.setItem(DEVICE_LOCK_KEY, JSON.stringify(data)); }
function clearDeviceLock(){ localStorage.removeItem(DEVICE_LOCK_KEY); }

const ADMIN_RESET_PIN = "0987";

function mintaPinReset(){
  const pin = prompt("Masukkan kode admin untuk reset perangkat ini:");
  if (pin === null) return; // dibatalkan

  if (pin === ADMIN_RESET_PIN) {
    clearDeviceLock();
    alert("Perangkat berhasil direset.");
    location.reload();
  } else {
    alert("Kode salah.");
  }
}

function tampilkanInfoDeviceLock(nama){
  document.getElementById("lockedNamaText").innerText = nama;
  document.getElementById("deviceLockInfo").style.display = "block";
  namaInput.style.display = "none";
}

function terapkanNamaTerpilih(obj){
  namaTerpilih = obj.nama;

  document.getElementById("infoNama").innerText = obj.nama;
  document.getElementById("infoNim").innerText = obj.nim;
  document.getElementById("infoKampus").innerText = obj.kampus;
  document.getElementById("infoGender").innerText = obj.gender;

  document.getElementById("infoBox").style.display = "block";

  namaInput.value = obj.nama;
  namaInput.disabled = true;

  cekStatusAwal();
}

window.onload = function(){
  const locked = getDeviceLock();
  if(locked){
    tampilkanInfoDeviceLock(locked.nama);
    terapkanNamaTerpilih(locked);
  }
};

</script>
