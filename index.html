<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAZNAS Kota Yogyakarta</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f5f5f5;
    padding: 20px;
    overflow: hidden;
  }

  .bg-top {
    position: absolute;
    top: 0;
    left: 0;
    width: 150px;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 450px;
    text-align: center;
    padding: 30px;
  }

  .logo {
    width: 55vw;
    max-width: 250px;
    animation: float 3s ease-in-out infinite;
    margin-bottom: 40px;
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  .button-group {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    flex: 1 1 45%;
    padding: 18px;
    font-size: 1.1rem;
    font-weight: 600;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    transition: all 0.3s;
  }

  .btn-presensi { background-color: #f4c430; color: #000; }
  .btn-presensi:hover { background-color: #ddb122; }

  .btn-admin { background-color: #0f8f3a; color: #fff; }
  .btn-admin:hover { background-color: #0c6f2e; }

  @media (max-width: 768px) {
    .container { max-width: 90%; }
    .logo { max-width: 220px; }
    .btn { font-size: 1.2rem; padding: 20px; }
  }

  @media (max-width: 480px) {
    .container { max-width: 100%; padding: 20px; }
    .logo { width: 65vw; max-width: 280px; margin-bottom: 35px; }
    .button-group { flex-direction: column; gap: 25px; }
    .btn { width: 100%; padding: 22px; font-size: 1.25rem; }
  }
</style>
</head>
<body>

  <img src="public/bg-top.png" class="bg-top">

  <div class="container">
    <img src="public/logo.png" class="logo">

    <div class="button-group">
      <a href="presensi.html">
        <button class="btn btn-presensi">Presensi</button>
      </a>
      <a href="login.html">
        <button class="btn btn-admin">Admin</button>
      </a>
    </div>
  </div>

</body>
</html>
